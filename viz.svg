<text x="56.0" y="369.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">81 cells × 3 claims — O(1) work total. The box index formula (r/3)*3 + c/3 is the</text>
