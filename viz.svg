<text x="56.0" y="265.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">One scan with three seen-sets: a digit registers (row, d), (col, d), (box, d) where</text>
<text x="56.0" y="284.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">box = (r/3, c/3). Any second registration of the same key → invalid.</text>
